name: Generate AI Summaries

on:
  schedule:
    # 8 AM, 12 PM, 5 PM Pacific (PDT = UTC-7, used Mar-Nov)
    # During PST (Nov-Mar), these shift to 7 AM, 11 AM, 4 PM PT
    # which is acceptable -- close enough and no duplicate runs.
    - cron: '0 15 * * *'   # 8 AM PDT / 7 AM PST
    - cron: '0 19 * * *'   # 12 PM PDT / 11 AM PST
    - cron: '0 0 * * *'    # 5 PM PDT / 4 PM PST
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate summaries
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_summaries.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add summaries.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update AI summaries [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
