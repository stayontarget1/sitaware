name: Generate AI Summaries

on:
  schedule:
    # 8:00 AM, 12:00 PM, 5:00 PM Pacific Time
    # Cover both PDT (UTC-7) and PST (UTC-8) so the schedule
    # stays correct year-round. Duplicate crons are harmless --
    # the script is idempotent and the extra run just no-ops.
    - cron: '0 15 * * *'   # 8 AM PDT
    - cron: '0 16 * * *'   # 8 AM PST
    - cron: '0 19 * * *'   # 12 PM PDT
    - cron: '0 20 * * *'   # 12 PM PST
    - cron: '0 0 * * *'    # 5 PM PDT
    - cron: '0 1 * * *'    # 5 PM PST
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate summaries
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_summaries.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add summaries.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update AI summaries [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
